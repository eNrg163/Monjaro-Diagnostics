name: Build Monjaro DIAG Recovery APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'odometerdiag-recovery/**'
      - '.github/workflows/build-odometerdiag-recovery.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odometerdiag-recovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Monjaro-DIAG-Recovery-debug
          path: odometerdiag-recovery/app/build/outputs/apk/debug/*.apk
