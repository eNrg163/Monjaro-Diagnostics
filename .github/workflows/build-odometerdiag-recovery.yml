name: Build Monjaro DIAG Recovery APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'odometerdiag-recovery/**'
      - '.github/workflows/build-odometerdiag-recovery.yml'
      - '.github/workflows/reusable-android-build.yml'
jobs:
  build:
    uses: ./.github/workflows/reusable-android-build.yml
    with:
      project_dir: odometerdiag-recovery
      java_version: '17'
      gradle_version: '8.10.2'
      artifact_name: Monjaro-DIAG-Recovery-debug
