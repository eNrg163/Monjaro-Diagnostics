name: Build Monjaro DIAG Recovery APK

# Auto-build only when the Android project changes.
# Workflow edits, documentation and unrelated projects do not start builds.
on:
  push:
    branches: [main]
    paths:
      - 'odometerdiag-recovery/app/**'
      - 'odometerdiag-recovery/build.gradle'
      - 'odometerdiag-recovery/settings.gradle'
      - 'odometerdiag-recovery/gradle.properties'
      - 'odometerdiag-recovery/gradle/**'
  workflow_dispatch:

# Only the newest pending/running build survives rapid consecutive pushes.
concurrency:
  group: monjaro-diag-recovery-build
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/reusable-android-build.yml
    with:
      project_dir: odometerdiag-recovery
      java_version: '17'
      gradle_version: '8.10.2'
      artifact_name: Monjaro-DIAG-Recovery-debug
