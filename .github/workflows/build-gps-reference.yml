name: Build Monjaro GPS Reference APK
on:
  push:
    paths:
      - 'gps-reference/**'
      - '.github/workflows/build-gps-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: |
          set -euo pipefail
          cd gps-reference
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Monjaro-GPS-Reference-debug
          path: gps-reference/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
