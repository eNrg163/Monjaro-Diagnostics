plugins { id 'com.android.application' }
android {
    namespace 'ack48.monjarodev.odometerdiag.recovery'
    compileSdk 35
    signingConfigs {
        stable {
            if (System.getenv('MONJARO_KEYSTORE_PATH')) {
                storeFile file(System.getenv('MONJARO_KEYSTORE_PATH'))
                storePassword System.getenv('MONJARO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MONJARO_KEY_ALIAS')
                keyPassword System.getenv('MONJARO_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('MONJARO_KEYSTORE_PATH')) signingConfig signingConfigs.stable
        }
    }
    defaultConfig {
        applicationId 'ack48.monjarodev.odometerdiag.autodiscovery'
        minSdk 23
        targetSdk 28
        versionCode 27
        versionName '2.7-auto-phone'
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
